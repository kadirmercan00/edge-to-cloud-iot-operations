; ═══════════════════════════════════════════════════════════
; edge-to-cloud-iot-operations — Smart Card Firmware
; Personnel Tracking Card (ESP32 + ST7735 TFT + BLE)
; ═══════════════════════════════════════════════════════════

[env:smart-card]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^1.4.0
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.0
    adafruit/Adafruit GFX Library@^1.11.0
    fastled/FastLED@^3.6.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DDEVICE_TYPE=\"SMART_CARD\"
    -DFW_VERSION=\"3.5.6\"
    -DTFT_CS=5
    -DTFT_RST=16
    -DTFT_DC=4
