; ═══════════════════════════════════════════════════════════
; edge-to-cloud-iot-operations — Anchor Unit Firmware
; Field Telemetry Node (ESP32-WROOM-32)
; ═══════════════════════════════════════════════════════════

[env:anchor-unit]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^1.4.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DDEVICE_TYPE=\"ANCHOR\"
    -DFW_VERSION=\"3.5.6\"
