; ═══════════════════════════════════════════════════════════
; edge-to-cloud-iot-operations — BLE ToF Gateway Firmware
; BLE Sensor Scanner & MQTT Forwarder (ESP32)
; ═══════════════════════════════════════════════════════════

[env:ble-tof-gateway]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^1.4.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DDEVICE_TYPE=\"BLE_GATEWAY\"
    -DFW_VERSION=\"2.1.0\"
    -DMAX_SENSORS=4
