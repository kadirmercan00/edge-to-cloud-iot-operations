[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

board_build.partitions = min_spiffs.csv

lib_deps =
    WiFi
    WiFiClientSecure
    HTTPClient
    HTTPUpdate
